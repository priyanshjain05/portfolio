<!doctype html>
<!-- Share image (1200×630). Re-render with:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars --window-size=1200,630 --virtual-time-budget=5000 --screenshot=assets/og-image.png http://localhost:5173/tools/og.html (with the preview server running) -->
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600&family=Inter:wght@400;500&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/kit/iso.css">
<link rel="stylesheet" href="../assets/fig/space-iso.css">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#04050b}
body{position:relative;font-family:Inter,system-ui,sans-serif;color:#e9edf7}
canvas{position:absolute;inset:0}
.glow{position:absolute;right:-120px;top:-60px;width:820px;height:760px;background:radial-gradient(closest-side,rgba(110,130,255,.22),rgba(110,130,255,.05) 60%,transparent)}
#station{position:absolute;right:-40px;top:70px;width:740px}
.text{position:absolute;left:72px;top:150px;width:600px}
.k{font:500 17px 'JetBrains Mono',monospace;letter-spacing:.24em;text-transform:uppercase;color:#a3abbf}
h1{font:600 92px/.95 'Space Grotesk',sans-serif;margin:18px 0 22px;letter-spacing:-.035em}
.t{font:400 29px/1.3 'Space Grotesk',sans-serif;color:#e9edf7;white-space:nowrap}
.u{position:absolute;left:72px;bottom:56px;font:500 20px 'JetBrains Mono',monospace;color:#7fe3ff;letter-spacing:.04em}
</style>
</head>
<body class="iso space">
<canvas id="c" width="1200" height="630"></canvas>
<div class="glow"></div>
<div id="station"></div>
<div class="text">
  <div class="k">Product · Space · NYU Stern</div>
  <h1>Priyansh Jain</h1>
  <div class="t">I build products for what comes next.</div>
</div>
<div class="u">priyanshjain.info</div>
<script type="module">
  const c = document.getElementById("c"), g = c.getContext("2d");
  let s = 7; const r = () => ((s = (s * 16807) % 2147483647) / 2147483647);
  const bg = g.createRadialGradient(800, 260, 0, 800, 260, 900); bg.addColorStop(0, "#0b0e22"); bg.addColorStop(1, "#03040a"); g.fillStyle = bg; g.fillRect(0, 0, 1200, 630);
  for (let i = 0; i < 900; i++) { g.globalAlpha = 0.25 + r() * 0.7; g.fillStyle = r() < 0.15 ? "#bfe0ff" : r() < 0.06 ? "#ffd9b8" : "#fff"; const z = r() * 1.6 + 0.3; g.fillRect(r() * 1200, r() * 630, z, z); }
  import("../assets/fig/station.mjs").then((m) => { m.mount(document.getElementById("station")); });
</script>
</body>
</html>
